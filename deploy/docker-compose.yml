# Production stack: the app behind Caddy, which gets HTTPS certificates automatically.
# Used by deploy/setup.sh; settings come from deploy/.env.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      LOOK_DB: /data/look.db
      LOOK_BEHIND_PROXY: "1"
    volumes:
      - look-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  look-data:
  caddy-data:
  caddy-config:
