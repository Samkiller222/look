# One-click deploy to Render in Frankfurt (EU): https://render.com/docs/blueprint-spec
services:
  - type: web
    name: look
    runtime: docker
    region: frankfurt
    plan: starter          # a persistent disk needs a paid plan
    healthCheckPath: /
    disk:
      name: look-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LOOK_REGION
        value: eu
      - key: LOOK_SECRET_KEY
        generateValue: true
      - key: LOOK_BEHIND_PROXY   # Render terminates HTTPS; trust its forwarded headers
        value: "1"
      - key: LOOK_RETENTION_DAYS
        value: "180"
      # First logins; each gets a random password printed once in the logs.
      - key: LOOK_BOOTSTRAP_USERS
        value: sam:requester,sam-reviewer:reviewer
      # Change this value to give the bootstrap users new passwords (printed in the logs).
      - key: LOOK_RESET_LOGINS
        value: "2026-11-05-1"
