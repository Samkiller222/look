[project]
name = "look"
version = "0.1.0"
description = "Consent-based background screening from official public records"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0", "gunicorn>=22.0"]

[project.scripts]
look = "look.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["look*"]
